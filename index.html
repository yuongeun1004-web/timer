<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>운동 타이머</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e5e9ef;--p:#16a34a;--pd:#15803d;--pl:#dcfce7;--b:#2563eb;--bl:#dbeafe;--danger:#dc2626;--dl:#fee2e2;--warn:#f59e0b;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.45;font-size:15px}
button,input,select{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding:18px 16px calc(104px + env(safe-area-inset-bottom))}
h1.page{font-size:22px;margin:4px 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 0 0 1px var(--line)}
.card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{margin:0}
.stat .l{color:var(--muted);font-size:13px}
.stat .v{font-size:26px;font-weight:700;margin-top:2px;letter-spacing:-.5px}
.stat .v.g{color:var(--p)} .stat .v.bl{color:var(--b)}
.btn{appearance:none;border:0;border-radius:14px;min-height:48px;padding:0 18px;font-weight:600;cursor:pointer;background:#eef1f5;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:filter .15s}
.btn:hover{filter:brightness(.96)} .btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--p);color:#fff} .btn.blue{background:var(--b);color:#fff}
.btn.dark{background:#0f172a;color:#fff} .btn.warn{background:var(--warn);color:#fff}
.btn.danger{background:var(--danger);color:#fff} .btn.soft{background:var(--pl);color:var(--pd)}
.btn.big{min-height:60px;font-size:17px;flex:1}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.link{background:none;color:var(--muted);min-height:44px;font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
button.row{cursor:pointer}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small,.hint{color:var(--muted);font-size:12.5px}
.row .dur{font-weight:700;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.empty-msg{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.badge.running{background:var(--pl);color:var(--pd)} .badge.paused{background:#fef3c7;color:#b45309}
.menu2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* timer */
.timer-card{text-align:center;padding:24px 16px}
.tlabel{font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.clock{font-size:clamp(46px,15vw,88px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:10px 0 18px;line-height:1.1}
.timer-card.running .clock{color:var(--p)} .timer-card.paused .clock{color:#b45309}
.trow{display:flex;gap:12px;margin-bottom:6px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chip{appearance:none;background:#f8fafc;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;min-height:64px;display:flex;flex-direction:column;gap:2px}
.chip .n{font-weight:600;display:flex;align-items:center;gap:8px}
.chip small{color:var(--muted);font-size:12px;padding-left:20px}
.chip.sel{border-color:var(--p);background:var(--pl)}
.chip.act{border-color:var(--b);background:var(--bl)}
.star{color:var(--warn)}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head .t{font-size:18px;font-weight:700}
.icon-btn{appearance:none;border:0;background:#eef1f5;width:44px;height:44px;border-radius:12px;font-size:18px;cursor:pointer}
.dow,.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:600}
.dow div:first-child{color:var(--danger)}
.cell{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:62px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;overflow:hidden}
.cell.empty{border:0;background:none;cursor:default}
.cell .dn{font-size:13px;font-weight:600}
.cell .ct{font-size:11px;font-weight:700;color:var(--pd);background:var(--pl);border-radius:6px;padding:0 4px;margin-top:2px;white-space:nowrap}
.cell .cn{font-size:10px;color:var(--muted);white-space:nowrap}
.cell.today .dn{background:var(--p);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cell.selected{border:2px solid var(--b);background:#f5f9ff}
.cell.sun .dn{color:var(--danger)} .cell.today.sun .dn{color:#fff}
/* stats */
.seg{display:flex;background:#e6eaef;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;min-height:42px;border-radius:11px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.bar-row{margin:12px 0}
.bar-row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}
.bar{height:10px;background:#eef1f5;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{width:190px;height:190px;flex:none}
.legend{flex:1;min-width:180px}
.legend .row{padding:8px 0}
svg text{font-family:inherit}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.navin{max-width:760px;margin:0 auto;display:flex}
.navin button{flex:1;border:0;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer}
.navin button.on{color:var(--p)}
.navin svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:600px){.overlay{align-items:center;padding:20px}.modal{border-radius:22px}}
.modal h3{margin:0 0 12px;font-size:18px}
.mmsg{margin:0 0 10px;line-height:1.6}
.mbody label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 6px}
.mbody input,.mbody select{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}
.mbody input:focus,.mbody select:focus,.addrow input:focus{outline:2px solid var(--b);border-color:transparent}
.tin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tin div{display:flex;align-items:center;gap:6px}
.tin span{font-size:13px;color:var(--muted);white-space:nowrap}
.mact{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.mact .btn{flex:1;min-width:110px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172aef;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;max-width:90vw;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.addrow{display:flex;gap:8px;margin-bottom:8px}
.addrow input{flex:1;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-width:0}
.exrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exrow .btn{min-height:40px;padding:0 10px;font-size:13px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:130px}
.testrow{padding:6px 0;font-size:14px}
@media(min-width:700px){.cell{min-height:84px}.cell .dn{font-size:15px}.cell .ct{font-size:12px}.cell .cn{font-size:11.5px}.stat .v{font-size:30px}}
</style>
</head>

<script>
/* 격리된 미리보기(about:srcdoc)에서 history API가 막히는 경우 오류를 무시 */
(function(){
  ['replaceState','pushState'].forEach(function(k){
    var orig=history[k];if(!orig)return;
    history[k]=function(){try{return orig.apply(history,arguments)}catch(e){}};
  });
})();
</script>
<script>
/* 오류 표시용: 스크립트 오류가 나면 화면 상단에 빨간 배너로 보여줌 */
(function(){
  function show(m){
    var d=document.getElementById('__err');
    if(!d){d=document.createElement('div');d.id='__err';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 14px;font:13px/1.4 system-ui,sans-serif;white-space:pre-wrap;word-break:break-all';(document.body||document.documentElement).appendChild(d)}
    d.textContent='⚠ 오류: '+m;
  }
  window.__showErr=show;
  window.addEventListener('error',function(e){show((e.message||'알 수 없는 오류')+(e.lineno?'  (줄 '+e.lineno+')':''))});
  window.addEventListener('unhandledrejection',function(e){show('Promise 오류: '+(e.reason&&e.reason.message||e.reason))});
})();
</script>
<div class="app"><main id="view"></main></div>
<nav class="bottom" aria-label="하단 메뉴"><div class="navin" id="nav"></div></nav>
<input type="file" id="impFile" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= 설정 / 상태 ================= */
const KEY='workout-timer-app-v1';
const TITLE='운동 타이머';
const PALETTE=['#16a34a','#2563eb','#f59e0b','#db2777','#7c3aed','#0891b2','#ea580c','#65a30d','#475569','#e11d48'];
const DOW=['일','월','화','수','목','금','토'];
let nowFn=()=>Date.now();     // 테스트용으로 교체 가능한 시계
let dryRun=false;             // true이면 저장소에 쓰지 않음(자가 진단용)
let S;                        // {version, exercises, records, timer, lastBackup}
let ui={};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');

/* ================= 날짜/시간 포맷 ================= */
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const todayKey=()=>dkey(new Date(nowFn()));
const weekStart=k=>addDays(k,-parseKey(k).getDay());
const longDate=k=>{const d=parseKey(k);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`};
const longDateW=k=>longDate(k)+` ${DOW[parseKey(k).getDay()]}요일`;
const shortDate=k=>{const d=parseKey(k);return `${d.getMonth()+1}월 ${d.getDate()}일`};
function dateLabel(k){const t=todayKey();return k===t?'오늘':k===addDays(t,-1)?'어제':shortDate(k)}
function fmtDur(s){
  s=Math.round(s); if(s<=0) return '0분';
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=[];
  if(h)p.push(h+'시간'); if(m)p.push(m+'분'); if(x&&!h)p.push(x+'초');
  return p.join(' ')||'0분';
}
function chartLabel(s){s=Math.round(s);return s<60?s+'초':s<6000?Math.floor(s/60)+'분':(s/3600).toFixed(1)+'시간'}
function fmtClock(ms){const t=Math.floor(Math.max(0,ms)/1000);return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60)}

/* ================= 저장소 ================= */
function defaultState(){
  const names=['걷기','달리기','근력운동','자전거','수영','요가','스트레칭','홈트레이닝'];
  return {version:1,exercises:names.map((n,i)=>({id:'d'+(i+1),name:n,fav:i<3,deleted:false,color:PALETTE[i%PALETTE.length]})),records:[],timer:null,lastBackup:null};
}
// 불러온 데이터(저장소/백업 파일)를 검증하고 같은 날짜+종목은 합산
function sanitize(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.exercises)||!Array.isArray(d.records)) return null;
  const ex=[],ids=new Set();
  d.exercises.forEach((e,i)=>{
    if(!e||typeof e.name!=='string'||!e.name.trim()) return;
    const id=String(e.id||uid()); if(ids.has(id)) return; ids.add(id);
    ex.push({id,name:e.name.trim().slice(0,20),fav:!!e.fav,deleted:!!e.deleted,color:/^#[0-9a-f]{6}$/i.test(e.color)?e.color:PALETTE[i%PALETTE.length]});
  });
  const map=new Map();let skipped=0;
  d.records.forEach(r=>{
    if(!r||typeof r.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!ids.has(String(r.exerciseId))){skipped++;return}
    const sec=Math.round(Number(r.seconds)); if(!(sec>0)){skipped++;return}
    const k=r.date+'|'+r.exerciseId,up=Number(r.updatedAt)||0,cur=map.get(k);
    if(cur){cur.seconds+=sec;cur.updatedAt=Math.max(cur.updatedAt,up)}
    else map.set(k,{date:r.date,exerciseId:String(r.exerciseId),seconds:sec,updatedAt:up||Date.now()});
  });
  let timer=null;const t=d.timer;
  if(t&&ids.has(String(t.exerciseId))&&(t.status==='running'||t.status==='paused')){
    const acc=Number(t.accumulatedMs),st=Number(t.startedAt);
    if(isFinite(acc)&&acc>=0&&(t.status==='paused'||isFinite(st))){
      timer={exerciseId:String(t.exerciseId),status:t.status,startedAt:t.status==='running'?st:null,accumulatedMs:acc,
        startDate:/^\d{4}-\d{2}-\d{2}$/.test(t.startDate)?t.startDate:dkey(new Date(isFinite(st)?st:Date.now()))};
    }
  }
  return {state:{version:1,exercises:ex,records:[...map.values()],timer,lastBackup:typeof d.lastBackup==='string'?d.lastBackup:null},skipped};
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){setTimeout(()=>toast('이 브라우저에서는 저장소를 사용할 수 없어요. 데이터가 유지되지 않을 수 있습니다.'),500);return defaultState()}
  if(!raw) return defaultState();
  try{const r=sanitize(JSON.parse(raw));if(r) return r.state}catch(e){}
  try{localStorage.setItem(KEY+'.corrupt',raw)}catch(e){}
  setTimeout(()=>toast('저장된 데이터를 읽지 못해 손상본을 따로 보관하고 새로 시작했어요.'),500);
  return defaultState();
}
function save(){
  if(dryRun) return true;
  try{localStorage.setItem(KEY,JSON.stringify(S));return true}
  catch(e){toast('저장에 실패했어요. 저장 공간을 확인하고 백업을 받아 두세요.');return false}
}

/* ================= 데이터 조회/집계 ================= */
const activeEx=()=>{const a=S.exercises.filter(e=>!e.deleted);return [...a.filter(e=>e.fav),...a.filter(e=>!e.fav)]};
const exById=id=>S.exercises.find(e=>e.id===id)||{id,name:'(삭제된 종목)',color:'#9ca3af',deleted:true};
const getRec=(date,exId)=>S.records.find(r=>r.date===date&&r.exerciseId===exId);
const recsOn=date=>S.records.filter(r=>r.date===date);
const sumSec=a=>a.reduce((s,r)=>s+r.seconds,0);
const dayTotal=date=>sumSec(recsOn(date));
const rangeRecs=(a,b)=>S.records.filter(r=>r.date>=a&&r.date<=b);
const rangeTotal=(a,b)=>sumSec(rangeRecs(a,b));
function byExercise(recs){
  const m=new Map();recs.forEach(r=>m.set(r.exerciseId,(m.get(r.exerciseId)||0)+r.seconds));
  return [...m].map(([id,sec])=>({ex:exById(id),sec})).sort((a,b)=>b.sec-a.sec);
}

/* ================= 기록 조작 (자동 합산의 핵심) ================= */
// 같은 날짜 + 같은 종목이면 시간을 더하고, 아니면 새 기록 생성
function addSeconds(date,exId,sec){
  sec=Math.round(sec); if(!(sec>0)) return false;
  const r=getRec(date,exId);
  if(r){r.seconds+=sec;r.updatedAt=nowFn()}
  else S.records.push({date,exerciseId:exId,seconds:sec,updatedAt:nowFn()});
  return save();
}
function setSeconds(date,exId,sec){
  const r=getRec(date,exId); sec=Math.round(sec);
  if(!r||!(sec>0)) return false;
  r.seconds=sec;r.updatedAt=nowFn();return save();
}
function deleteRec(date,exId){
  S.records=S.records.filter(r=>!(r.date===date&&r.exerciseId===exId));return save();
}

/* ================= 타이머 (시작시각 + 누적시간 기반) ================= */
function elapsedMs(t){
  if(!t) return 0;
  return Math.max(0,t.accumulatedMs+(t.status==='running'?Math.max(0,nowFn()-t.startedAt):0));
}
function startTimer(exId){S.timer={exerciseId:exId,status:'running',startedAt:nowFn(),accumulatedMs:0,startDate:todayKey()};save()}
function pauseTimer(){
  const t=S.timer;if(!t||t.status!=='running')return;
  t.accumulatedMs+=Math.max(0,nowFn()-t.startedAt);t.status='paused';t.startedAt=null;save();
}
function resumeTimer(){const t=S.timer;if(!t||t.status!=='paused')return;t.status='running';t.startedAt=nowFn();save()}
function finishTimer(){
  const t=S.timer;if(!t)return 0;
  const sec=Math.round(elapsedMs(t)/1000);
  S.timer=null;
  if(sec>=1) addSeconds(t.startDate,t.exerciseId,sec); else save();
  return sec;
}
function cancelTimer(){S.timer=null;save()}

/* ================= UI 유틸 ================= */
let modalEl=null,toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function closeModal(){if(modalEl){modalEl.remove();modalEl=null}}
function dismissModal(){if(modalEl){const d=modalEl._dismiss;closeModal();d&&d()}}
function showModal({title,body='',actions=[],onDismiss}){
  closeModal();
  const el=document.createElement('div');el.className='overlay';
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><div class="mbody">${body}</div><div class="mact"></div></div>`;
  const act=el.querySelector('.mact');
  actions.forEach(a=>{
    const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;
    b.onclick=()=>{const r=a.onClick?a.onClick(el):undefined;if(r===false)return;if(modalEl===el)closeModal()};
    act.appendChild(b);
  });
  el.addEventListener('mousedown',e=>{if(e.target===el)dismissModal()});
  el._dismiss=onDismiss;
  document.body.appendChild(el);modalEl=el;
  const f=el.querySelector('input,select');if(f)f.focus();
  return el;
}

/* ================= 종목 직접 추가/삭제 ================= */
function openExManager(){
  const el=showModal({title:'운동 종목 관리',
    body:`<div style="display:flex;gap:8px;margin-bottom:12px"><input id="exNew" type="text" maxlength="20" placeholder="새 운동 이름 (예: 필라테스)" autocomplete="off" style="flex:1;min-width:0;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff"><button type="button" class="btn primary" id="exAdd">추가</button></div><div id="exList" style="max-height:46vh;overflow:auto"></div>`,
    actions:[{label:'닫기',cls:'primary',onClick:()=>{render()}}],onDismiss:()=>render()});
  const list=el.querySelector('#exList'),inp=el.querySelector('#exNew');
  function draw(){
    const a=activeEx();
    list.innerHTML=a.length?a.map(e=>`<div class="row"><span class="dot" style="background:${e.color}"></span><div class="grow"><b>${esc(e.name)}</b></div><button type="button" class="btn sm danger" data-del="${esc(e.id)}">삭제</button></div>`).join(''):'<p class="empty-msg">등록된 종목이 없어요.</p>';
  }
  function add(){
    const name=inp.value.trim().replace(/\s+/g,' ').slice(0,20);
    if(!name){toast('운동 이름을 입력해 주세요.');inp.focus();return}
    const same=S.exercises.find(e=>e.name===name);
    if(same&&!same.deleted){toast('이미 있는 종목이에요.');inp.focus();return}
    if(same) same.deleted=false;
    else S.exercises.push({id:uid(),name,fav:false,deleted:false,color:PALETTE[S.exercises.length%PALETTE.length]});
    if(save()) toast(`'${name}' 종목을 추가했어요.`);
    inp.value='';draw();inp.focus();
  }
  el.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-del]');
    if(b){askDeleteEx(b.getAttribute('data-del'));return}
    if(ev.target.id==='exAdd') add();
  });
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();add()}});
  draw();
}
function askDeleteEx(id){
  const ex=S.exercises.find(e=>e.id===id); if(!ex) return;
  if(S.timer&&S.timer.exerciseId===id){toast('진행 중인 타이머의 종목은 삭제할 수 없어요. 먼저 종료하거나 취소해 주세요.');return}
  const n=S.records.filter(r=>r.exerciseId===id).length;
  const acts=[{label:'취소',onClick:()=>{openExManager()}}];
  if(n) acts.push({label:'종목만 삭제 (기록 유지)',onClick:()=>{ex.deleted=true;ex.fav=false;save();toast(`'${ex.name}' 종목을 삭제했어요. 기록은 남아 있어요.`);openExManager()}});
  acts.push({label:n?'기록까지 삭제':'삭제',cls:'danger',onClick:()=>{
    S.exercises=S.exercises.filter(e=>e.id!==id);
    S.records=S.records.filter(r=>r.exerciseId!==id);
    save();toast(`'${ex.name}' 종목을 삭제했어요.`);openExManager();
  }});
  showModal({title:`'${ex.name}' 삭제`,
    body:`<p class="mmsg">${n?`이 종목의 운동 기록이 ${n}일치 있어요. 기록을 어떻게 할까요?`:'이 종목을 삭제할까요?'}</p>`,
    actions:acts,onDismiss:()=>openExManager()});
}

/* ================= 화면: 통계 ================= */
function barList(items,total){
  const max=items[0]?items[0].sec:1;
  return items.map(it=>`<div class="bar-row"><div class="top"><span><span class="dot" style="background:${it.ex.color}"></span> ${esc(it.ex.name)}</span><b>${fmtDur(it.sec)} <span class="hint">(${(it.sec/total*100).toFixed(1)}%)</span></b></div><div class="bar"><i style="width:${it.sec/max*100}%;background:${it.ex.color}"></i></div></div>`).join('');
}
function weekChart(days){
  const W=350,H=200,top=26,bot=38,bw=30,ph=H-top-bot,max=Math.max(1,...days.map(d=>d.total)),gap=W/7,t=todayKey();
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="주간 운동량 막대그래프"><line x1="0" x2="${W}" y1="${top+ph}" y2="${top+ph}" stroke="#e5e9ef"/>`;
  days.forEach((d,i)=>{
    const x=gap*i+(gap-bw)/2;let y=top+ph;
    d.segs.forEach(sg=>{const h=sg.sec/max*ph;y-=h;s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,.5)}" fill="${sg.color}"/>`});
    if(d.total>0)s+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">${chartLabel(d.total)}</text>`;
    const isT=d.key===t;
    s+=`<text x="${x+bw/2}" y="${H-20}" text-anchor="middle" font-size="12" font-weight="700" fill="${isT?'#16a34a':i===0?'#dc2626':'#475569'}">${DOW[i]}</text><text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="#94a3b8">${parseKey(d.key).getDate()}</text>`;
  });
  return s+'</svg>';
}
function donut(items,total){
  let off=25,s=`<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="종목별 비율 원형그래프"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#eef1f5" stroke-width="6"/>`;
  items.forEach(it=>{const p=it.sec/total*100;s+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${it.ex.color}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p});
  return s+`<text x="21" y="20.5" text-anchor="middle" font-size="3.4" fill="#64748b">총 시간</text><text x="21" y="26" text-anchor="middle" font-size="4.6" font-weight="700" fill="#0f172a">${chartLabel(total)}</text></svg>`;
}

    <section class="card"><h2>종목별 비율</h2>${items.length?`<div class="donut-wrap">${donut(items,tot)}<div class="legend">${items.map(it=>`<div class="row"><span class="dot" style="background:${it.ex.color}"></span><div class="grow"><b>${esc(it.ex.name)}</b></div><span class="dur">${(it.sec/tot*100).toFixed(1)}%</span></div>`).join('')}</div></div>`:'<p class="empty-msg">기록이 없어요.</p>'}</section>`;
  }
  return `<h1 class="page">통계</h1><div class="seg" role="tablist">${[['day','일별'],['week','주간'],['month','월간']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="st-tab" data-t="${k}">${l}</button>`).join('')}</div><section class="card" style="padding-bottom:10px">${nav}</section>${body}`;

  <section class="card"><h2>데이터 백업 · 복원</h2>
    <p class="hint" style="margin:0 0 12px">기록은 이 기기의 브라우저에만 저장됩니다. 기록 ${S.records.length}건 · 종목 ${S.exercises.filter(e=>!e.deleted).length}개 · 약 ${(size/1024).toFixed(1)}KB<br>마지막 백업: ${S.lastBackup?new Date(S.lastBackup).toLocaleString('ko-KR'):'없음'}</p>
    <div class="btns"><button class="btn primary" data-act="export">⬇ JSON 백업 내보내기</button><button class="btn" data-act="import">⬆ 백업 불러오기(복원)</button></div></section>
  <section class="card"><h2>기능 점검</h2><p class="hint" style="margin:0 0 12px">가상 시계로 타이머·자동 합산·수정·삭제·새로고침 복원·백업 복원을 점검합니다. 실제 데이터는 변경되지 않습니다.</p><button class="btn" data-act="selftest">자가 진단 실행</button></section>
  <section class="card"><h2>위험 구역</h2><button class="btn danger block" data-act="reset">모든 데이터 초기화</button></section>`;
}

/* ================= 렌더링 ================= */
const ICONS={
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  stats:'<path d="M5 20v-8M12 20V5M19 20v-5"/>',
  settings:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'
};
const TABS=[['home','홈'],['timer','타이머'],['calendar','캘린더'],['stats','통계'],['settings','설정']];
function buildNav(){document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-tab="${k}" data-nav="${k}" aria-label="${l}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}</button>`).join('')}
function render(){
  const views={home:viewHome,timer:viewTimer,calendar:viewCalendar,stats:viewStats,settings:viewSettings};
  document.getElementById('view').innerHTML=views[ui.tab]();
  document.querySelectorAll('[data-nav]').forEach(b=>{const on=b.dataset.nav===ui.tab;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  tick();
}
function go(tab){
  ui.tab=tab;
  if(location.hash!=='#'+tab) history.replaceState(null,'','#'+tab);
  render();window.scrollTo(0,0);
}
function tick(){
  const t=S.timer;
  if(t){
    const c=fmtClock(elapsedMs(t));
    document.querySelectorAll('[data-live="timer"]').forEach(el=>{if(el.textContent!==c)el.textContent=c});
    document.title=`${c} · ${exById(t.exerciseId).name}`;
  }else if(document.title!==TITLE) document.title=TITLE;
  const tk=todayKey();if(tk!==ui.today){ui.today=tk;render()}
}

/* ================= 기록 입력/수정 폼 ================= */
function recordForm({edit=false,date,ex}){
  const rec=edit?getRec(date,ex):null;
  if(edit&&!rec){render();return}
  const acts=activeEx();
  if(!edit&&!acts.length){toast('먼저 설정에서 운동 종목을 추가해 주세요.');return}
  let h='',m='',s='';
  if(rec){const hh=Math.floor(rec.seconds/3600),mm=Math.floor(rec.seconds%3600/60),ss=rec.seconds%60;h=hh||'';m=mm||'';s=ss||''}
  const pick=ex||ui.selEx||(acts[0]&&acts[0].id);
  const head=edit?`<p class="mmsg"><b>${longDate(date)}</b><br>${esc(exById(ex).name)}</p>`
    :`<label>날짜</label><input type="date" id="f-date" value="${date}"><label>운동 종목</label><select id="f-ex">${acts.map(e=>`<option value="${e.id}" ${e.id===pick?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`;
  showModal({title:edit?'기록 수정':'운동 시간 추가',
    body:head+`<label>${edit?'수정할 운동 시간':'추가할 운동 시간'}</label><div class="tin"><div><input id="f-h" type="number" inputmode="numeric" min="0" max="24" placeholder="0" value="${h}"><span>시간</span></div><div><input id="f-m" type="number" inputmode="numeric" min="0" max="59" placeholder="0" value="${m}"><span>분</span></div><div><input id="f-s" type="number" inputmode="numeric" min="0" max="59" placeholder="0" value="${s}"><span>초</span></div></div>
    <p class="hint" style="margin-top:10px">${edit?'저장하면 이 기록의 시간이 입력한 값으로 바뀝니다.':'같은 날짜·같은 종목 기록이 이미 있으면 시간이 자동으로 합산됩니다.'}</p>`,
    actions:[{label:'취소'},{label:edit?'저장':'추가',cls:'primary',onClick:el=>{
      const g=id=>{const v=el.querySelector(id).value.trim();return v===''?0:Number(v)};
      const hh=g('#f-h'),mm=g('#f-m'),ss=g('#f-s');
      if([hh,mm,ss].some(v=>!Number.isInteger(v)||v<0)||hh>24||mm>59||ss>59){toast('시간은 0 이상의 정수로 입력해 주세요. (분·초는 59 이하)');return false}
      const sec=hh*3600+mm*60+ss;
      if(sec<=0){toast('0보다 큰 운동 시간을 입력해 주세요.');return false}
      if(edit){setSeconds(date,ex,sec);toast('기록을 수정했어요.')}
      else{
        const d=el.querySelector('#f-date').value,eid=el.querySelector('#f-ex').value;
        if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast('날짜를 선택해 주세요.');return false}
        addSeconds(d,eid,sec);ui.sel=d;
        const p=parseKey(d);ui.calY=p.getFullYear();ui.calM=p.getMonth();
        toast(`${exById(eid).name} +${fmtDur(sec)} → ${dateLabel(d)} 합계 ${fmtDur(getRec(d,eid).seconds)}`);
      }
      render();
    }}]});
}
function deleteRecord(date,ex){
  const r=getRec(date,ex);if(!r)return;
  confirmBox('기록 삭제',`<b>${longDate(date)}</b><br>${esc(exById(ex).name)} ${fmtDur(r.seconds)} 기록을 삭제할까요?<br><span class="hint">삭제하면 캘린더와 통계에서도 사라집니다.</span>`,'삭제',true)
    .then(ok=>{if(ok){deleteRec(date,ex);toast('기록을 삭제했어요.');render()}});
}

/* ================= 타이머 시작 충돌 처리 ================= */
function requestStart(exId){
  const t=S.timer;
  if(!t){startTimer(exId);render();toast(`${exById(exId).name} 타이머를 시작했어요.`);return}
  if(t.exerciseId===exId)return;
  const cur=exById(t.exerciseId);
  showModal({title:'진행 중인 운동이 있어요',
    body:`<p class="mmsg"><b>${esc(cur.name)}</b> 타이머가 ${t.status==='running'?'진행':'일시정지'} 중입니다 (${fmtClock(elapsedMs(t))}).<br>${esc(exById(exId).name)}을(를) 시작하려면 기존 운동을 먼저 종료하세요.${t.status==='running'?'<br><span class="hint">잠시 멈추려면 일시정지를 누르세요.</span>':''}</p>`,
    actions:[{label:'닫기'},...(t.status==='running'?[{label:'일시정지',cls:'warn',onClick:()=>{pauseTimer();render()}}]:[]),
      {label:`저장하고 ${exById(exId).name} 시작`,cls:'primary',onClick:()=>{
        const sec=finishTimer();startTimer(exId);render();
        toast(sec>=1?`${cur.name} ${fmtDur(sec)} 기록 후 새 타이머를 시작했어요.`:'새 타이머를 시작했어요.');}}]});
}

/* ================= 종목 관리 ================= */
function addExercise(){
  const inp=document.getElementById('newEx');const name=inp.value.trim();
  if(!name){toast('종목 이름을 입력해 주세요.');return}
  if(S.exercises.some(e=>!e.deleted&&e.name.toLowerCase()===name.toLowerCase())){toast('이미 있는 종목이에요.');return}
  const old=S.exercises.find(e=>e.deleted&&e.name.toLowerCase()===name.toLowerCase());
  if(old){old.deleted=false}
  else S.exercises.push({id:uid(),name:name.slice(0,20),fav:false,deleted:false,color:PALETTE[S.exercises.length%PALETTE.length]});
  save();render();toast(`'${name}' 종목을 추가했어요.`);
  const n=document.getElementById('newEx');n&&n.focus();
}
function renameExercise(id){
  const ex=exById(id);
  showModal({title:'종목 이름 수정',body:`<input id="f-name" maxlength="20" value="${esc(ex.name)}">`,
    actions:[{label:'취소'},{label:'저장',cls:'primary',onClick:el=>{
      const n=el.querySelector('#f-name').value.trim();
      if(!n){toast('이름을 입력해 주세요.');return false}
      if(S.exercises.some(e=>!e.deleted&&e.id!==id&&e.name.toLowerCase()===n.toLowerCase())){toast('이미 있는 종목 이름이에요.');return false}
      ex.name=n;save();render();toast('이름을 수정했어요. 지난 기록에도 반영됩니다.');}}]});
}
function deleteExercise(id){
  const ex=S.exercises.find(e=>e.id===id);if(!ex)return;
  if(S.timer&&S.timer.exerciseId===id){toast('진행 중인 타이머의 종목은 삭제할 수 없어요. 먼저 종료해 주세요.');return}
  const rs=S.records.filter(r=>r.exerciseId===id);
  if(!rs.length){
    confirmBox('종목 삭제',`'${esc(ex.name)}' 종목을 삭제할까요?`,'삭제',true).then(ok=>{if(ok){S.exercises=S.exercises.filter(e=>e.id!==id);save();render()}});
    return;
  }
  showModal({title:'종목 삭제',body:`<p class="mmsg">'${esc(ex.name)}' 종목에는 기록 ${rs.length}건(총 ${fmtDur(sumSec(rs))})이 있어요.</p><p class="hint">‘종목만 삭제’는 목록에서만 숨기고 기존 기록은 캘린더·통계에 남깁니다.</p>`,
    actions:[{label:'취소'},{label:'종목만 삭제',onClick:()=>{ex.deleted=true;ex.fav=false;save();render();toast('종목을 삭제했어요. 기록은 유지됩니다.')}},
      {label:'기록까지 삭제',cls:'danger',onClick:()=>{
        confirmBox('기록까지 삭제',`'${esc(ex.name)}' 종목과 기록 ${rs.length}건을 모두 삭제합니다. 되돌릴 수 없어요.`,'모두 삭제',true).then(ok=>{
          if(ok){S.records=S.records.filter(r=>r.exerciseId!==id);S.exercises=S.exercises.filter(e=>e.id!==id);save();render();toast('종목과 기록을 삭제했어요.')}});}}]});
}

/* ================= 백업 / 복원 / 초기화 ================= */
function exportData(){
  const data={app:'workout-timer',version:1,exportedAt:new Date().toISOString(),exercises:S.exercises,records:S.records};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`workout-backup-${todayKey()}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  S.lastBackup=new Date().toISOString();save();render();toast('백업 파일을 내려받았어요.');
}
function importData(file){
  const fr=new FileReader();
  fr.onerror=()=>toast('파일을 읽지 못했어요.');
  fr.onload=()=>{
    let res=null;
    try{res=sanitize(JSON.parse(fr.result))}catch(e){}
    if(!res){toast('올바른 백업 파일이 아니에요.');return}
    const ns=res.state;
    confirmBox('백업 복원',`백업의 기록 <b>${ns.records.length}건</b>, 종목 <b>${ns.exercises.filter(e=>!e.deleted).length}개</b>로 현재 데이터를 덮어씁니다.<br>현재 기록 ${S.records.length}건은 대체됩니다.${res.skipped?`<br><span class="hint">유효하지 않은 기록 ${res.skipped}건은 제외됩니다.</span>`:''}`,'복원',true).then(ok=>{
      if(!ok)return;
      try{localStorage.setItem(KEY+'.prev',JSON.stringify(S))}catch(e){}
      if(S.timer){ // 진행 중인 타이머는 유지
        if(!ns.exercises.find(e=>e.id===S.timer.exerciseId)){const o=S.exercises.find(e=>e.id===S.timer.exerciseId);if(o)ns.exercises.push({...o})}
        ns.timer=S.timer;
      }else ns.timer=null;
      ns.lastBackup=S.lastBackup;
      S=ns;if(save()){toast('데이터를 복원했어요.')}render();
    });
  };
  fr.readAsText(file);
}
function resetData(){
  showModal({title:'모든 데이터 초기화',
    body:`<p class="mmsg">모든 운동 기록, 종목, 진행 중인 타이머가 삭제되며 <b>되돌릴 수 없습니다.</b></p><button class="btn block" data-act="export" style="margin-bottom:6px">먼저 백업 내려받기</button><label>계속하려면 “초기화”를 입력하세요</label><input id="f-reset" autocomplete="off" placeholder="초기화">`,
    actions:[{label:'취소'},{label:'모두 삭제',cls:'danger',onClick:el=>{
      if(el.querySelector('#f-reset').value.trim()!=='초기화'){toast('“초기화”를 정확히 입력해 주세요.');return false}
      S=defaultState();save();ui.selEx=null;render();toast('모든 데이터를 초기화했어요.');}}]});
}

/* ================= 자가 진단 ================= */
function runSelfTest(){
  const res=[],ok=(n,c,i='')=>res.push({n,pass:!!c,i});
  const orig=S,origNow=nowFn;dryRun=true;
  try{
    let clock=new Date(2026,10,23,10,0,0).getTime();nowFn=()=>clock;const adv=m=>{clock+=m*60000};
    S=defaultState();
    const walk=S.exercises.find(e=>e.name==='걷기').id,run=S.exercises.find(e=>e.name==='달리기').id;
    const D1='2026-11-23',D2='2026-11-24';
    startTimer(walk);adv(10);finishTimer();
    ok('1. 걷기 10분 측정 → 10분 저장',getRec(D1,walk)&&getRec(D1,walk).seconds===600,fmtDur(getRec(D1,walk)?.seconds||0));
    startTimer(walk);adv(5);pauseTimer();adv(30);resumeTimer();adv(15);finishTimer();
    ok('2. 걷기 20분(일시정지 30분 제외) 추가 → 30분 합산',getRec(D1,walk).seconds===1800&&recsOn(D1).length===1,fmtDur(getRec(D1,walk).seconds));
    addSeconds(D1,run,900);
    ok('3. 달리기 15분은 걷기와 별도 기록',getRec(D1,run).seconds===900&&recsOn(D1).length===2&&getRec(D1,walk).seconds===1800);
    addSeconds(D2,walk,1200);
    ok('4. 다음 날 걷기 20분은 합산되지 않음',getRec(D2,walk).seconds===1200&&getRec(D1,walk).seconds===1800);
    setSeconds(D1,walk,3600);
    ok('5. 기록 수정 → 일/월 합계 변경',dayTotal(D1)===4500&&rangeTotal('2026-11-01','2026-11-30')===5700,`${fmtDur(dayTotal(D1))} / 월 ${fmtDur(rangeTotal('2026-11-01','2026-11-30'))}`);
    deleteRec(D2,walk);
    ok('6. 기록 삭제 → 일/월 합계 반영',!getRec(D2,walk)&&dayTotal(D2)===0&&rangeTotal('2026-11-01','2026-11-30')===4500);
    startTimer(run);adv(7);
    const snap=JSON.stringify(S);adv(3);
    S=sanitize(JSON.parse(snap)).state;
    const e1=elapsedMs(S.timer);
    pauseTimer();const e2=elapsedMs(S.timer);adv(60);const e3=elapsedMs(S.timer);
    ok('7. 새로고침 후 경과시간 복원(10분) · 일시정지 중 정지',e1===600000&&e2===600000&&e3===600000,`복원 ${fmtClock(e1)} / 일시정지 후 ${fmtClock(e3)}`);
    cancelTimer();
    const before=JSON.stringify([...S.records].sort((a,b)=>(a.date+a.exerciseId).localeCompare(b.date+b.exerciseId)));
    const re=sanitize(JSON.parse(JSON.stringify(S))).state;
    ok('8. 저장 데이터 직렬화/재로딩 후 기록 유지',JSON.stringify([...re.records].sort((a,b)=>(a.date+a.exerciseId).localeCompare(b.date+b.exerciseId)))===before);
    const bk=JSON.parse(JSON.stringify({app:'workout-timer',version:1,exercises:S.exercises,records:S.records}));
    const rs=sanitize(bk).state;
    ok('9. JSON 백업 → 복원 일치',rs.records.length===S.records.length&&sumSec(rs.records)===sumSec(S.records)&&rs.exercises.length===S.exercises.length,`기록 ${rs.records.length}건`);
  }catch(e){ok('진단 중 오류',false,String(e))}
  finally{S=orig;nowFn=origNow;dryRun=false}
  const all=res.every(r=>r.pass);
  showModal({title:all?'✅ 모든 점검 통과':'⚠️ 일부 실패',body:res.map(r=>`<div class="testrow">${r.pass?'✅':'❌'} ${esc(r.n)}${r.i?` <span class="hint">(${esc(r.i)})</span>`:''}</div>`).join('')+'<p class="hint" style="margin-top:10px">10번(모바일·PC 동작)은 직접 화면에서 확인해 주세요.</p>',actions:[{label:'닫기',cls:'primary'}]});
}

/* ================= 이벤트 ================= */
const H={
  tab:d=>go(d.tab),
  quick:d=>{ui.selEx=d.id;go('timer')},
  'open-date':d=>{ui.sel=d.date;const p=parseKey(d.date);ui.calY=p.getFullYear();ui.calM=p.getMonth();go('calendar')},
  pick:d=>{if(S.timer){requestStart(d.id)}else{ui.selEx=d.id;render()}},
  start:()=>{if(ui.selEx)requestStart(ui.selEx)},
  pause:()=>{pauseTimer();render()},
  resume:()=>{resumeTimer();render()},
  finish:()=>{
    const t=S.timer;if(!t)return;const name=exById(t.exerciseId).name,date=t.startDate;
    const sec=finishTimer();render();
    toast(sec>=1?`${name} ${fmtDur(sec)} 기록 완료 (${dateLabel(date)} 합계 ${fmtDur(getRec(date,t.exerciseId).seconds)})`:'1초 미만이라 기록하지 않았어요.');
  },
  cancel:()=>{if(!S.timer)return;confirmBox('타이머 취소',`${esc(exById(S.timer.exerciseId).name)} ${fmtClock(elapsedMs(S.timer))} 측정을 <b>기록하지 않고</b> 종료할까요?`,'기록 없이 종료',true).then(ok=>{if(ok){cancelTimer();render();toast('기록 없이 종료했어요.')}})},
  'add-rec':d=>recordForm({date:d.date||todayKey()}),
  'edit-rec':d=>recordForm({edit:true,date:d.date,ex:d.ex}),
  'del-rec':d=>deleteRecord(d.date,d.ex),
  'cal-sel':d=>{ui.sel=d.date;render()},
  'cal-prev':()=>shiftCal(-1),'cal-next':()=>shiftCal(1),
  'cal-today':()=>{const t=todayKey(),p=parseKey(t);ui.calY=p.getFullYear();ui.calM=p.getMonth();ui.sel=t;render()},
  'st-tab':d=>{ui.stTab=d.t;render()},
  'st-prev':()=>shiftStat(-1),'st-next':()=>shiftStat(1),
  'st-now':()=>{const t=todayKey(),p=parseKey(t);ui.stDay=t;ui.stWeek=weekStart(t);ui.stY=p.getFullYear();ui.stM=p.getMonth();render()},
  'add-ex':addExercise,
  fav:d=>{const e=S.exercises.find(x=>x.id===d.id);if(e){e.fav=!e.fav;save();render()}},
  rename:d=>renameExercise(d.id),
  'del-ex':d=>deleteExercise(d.id),
  export:exportData,
  import:()=>document.getElementById('impFile').click(),
  selftest:runSelfTest,
  reset:resetData
};
function shiftCal(n){
  const d=new Date(ui.calY,ui.calM+n,1);ui.calY=d.getFullYear();ui.calM=d.getMonth();
  const pre=`${ui.calY}-${pad(ui.calM+1)}`,t=todayKey();
  ui.sel=t.startsWith(pre)?t:pre+'-01';render();
}
function shiftStat(n){
  if(ui.stTab==='day')ui.stDay=addDays(ui.stDay,n);
  else if(ui.stTab==='week')ui.stWeek=addDays(ui.stWeek,7*n);
  else{const d=new Date(ui.stY,ui.stM+n,1);ui.stY=d.getFullYear();ui.stM=d.getMonth()}
  render();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=H[el.dataset.act];if(fn){if(el.dataset.act==='export'||el.dataset.act==='reset'){}fn(el.dataset,el,e)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newEx')addExercise()});
(function(){const f=document.getElementById('impFile');if(f)f.addEventListener('change',e=>{const x=e.target.files[0];if(x)importData(x);e.target.value=''})})();

/* ================= 초기화 ================= */
function init(){
  S=load();
  try{if(!localStorage.getItem(KEY))save()}catch(e){}
  const t0=todayKey(),p=parseKey(t0);
  const h=location.hash.replace('#','');
  ui={tab:TABS.some(x=>x[0]===h)?h:'home',calY:p.getFullYear(),calM:p.getMonth(),sel:t0,stTab:'day',stDay:t0,stWeek:weekStart(t0),stY:p.getFullYear(),stM:p.getMonth(),selEx:null,today:t0};
  buildNav();render();
  setInterval(tick,250);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
  window.addEventListener('pageshow',tick);
  window.addEventListener('hashchange',()=>{const hh=location.hash.replace('#','');if(TABS.some(x=>x[0]===hh)&&hh!==ui.tab){ui.tab=hh;render()}});
  // 다른 탭에서 변경 시 동기화
  window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){S=load();render()}});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
try{init()}catch(err){window.__showErr&&window.__showErr('init 실패: '+(err&&err.message||err))}
</script>
<script>
/* 캘린더 칸: 종목별 이름 + 시간(예: 걷기 1시간)을 최대 3개까지 표시, 더 있으면 … 표시. 전체 합계 배지는 숨김 */
(function(){
  try{
    var st=document.createElement('style');
    st.textContent='.cell .ct{display:none}'
      +'.cell .cn-list{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:1px;margin-top:2px}'
      +'.cell .cn-list .cn{display:flex;justify-content:center;align-items:baseline;gap:3px;width:100%;line-height:1.3;padding:0 2px;min-width:0}'
      +'.cell .cn-list .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'
      +'.cell .cn-list .du{flex:none;font-weight:700;color:var(--pd);white-space:nowrap}'
      +'.cell .cn-list .cn.more{justify-content:center;font-weight:700;line-height:.9}'
      +'.cell{min-height:84px}';
    document.head.appendChild(st);
  }catch(e){}
  function fmt(sec){
    sec=Math.round(sec||0);
    if(sec<60)return sec>0?sec+'초':'0분';
    var m=Math.floor(sec/60),h=Math.floor(m/60),mm=m%60;
    if(h>0&&mm>0)return h+'시간 '+mm+'분';
    if(h>0)return h+'시간';
    return mm+'분';
  }
  var pending=false;
  function apply(){
    pending=false;
    var cells=document.querySelectorAll('.cell[data-date]');
    for(var i=0;i<cells.length;i++){
      var c=cells[i],date=c.getAttribute('data-date'),recs;
      try{recs=recsOn(date)}catch(e){continue}
      if(!recs||!recs.length)continue;
      var items=recs.slice().sort(function(a,b){return (b.seconds||0)-(a.seconds||0)}).map(function(r){
        var n;try{n=exById(r.exerciseId).name}catch(e){n='?'}
        return {n:n,s:r.seconds||0};
      });
      var key=items.map(function(x){return x.n+':'+x.s}).join('|');
      var old=c.querySelector('.cn-list');
      if(old&&old.getAttribute('data-k')===key)continue;
      var olds=c.querySelectorAll('.cn,.cn-list');
      for(var j=0;j<olds.length;j++)olds[j].remove();
      var box=document.createElement('div');box.className='cn-list';box.setAttribute('data-k',key);
      items.slice(0,3).forEach(function(x){
        var d=document.createElement('div');d.className='cn';d.title=x.n+' '+fmt(x.s);
        var a=document.createElement('span');a.className='nm';a.textContent=x.n;
        var b=document.createElement('span');b.className='du';b.textContent=fmt(x.s);
        d.appendChild(a);d.appendChild(b);box.appendChild(d);
      });
      if(items.length>3){
        var m=document.createElement('div');m.className='cn more';m.textContent='…';m.title='외 '+(items.length-3)+'개 더 있음';box.appendChild(m);
      }
      c.appendChild(box);
    }
  }
  function schedule(){if(pending)return;pending=true;requestAnimationFrame(apply)}
  try{
    new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});
    schedule();
  }catch(e){}
})();
</script>
